version: "3.8"

services:
  readarr:
    image: lscr.io/linuxserver/readarr:nightly
    container_name: readarr
    restart: unless-stopped
    networks:
      - app-net
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${STORAGE_PATH}/appdata/readarr:/config
      - ${MEDIA_PATH}:/media
      - ${DOWNLOADS_PATH}:/downloads
    labels:
      - "caddy=readarr.${LOCAL_DOMAIN}"
      - "caddy.reverse_proxy={{upstreams ${PORT_READARR}}}"
