version: "3.8"

services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    networks:
      - app-net
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${STORAGE_PATH}/appdata/lidarr:/config
      - ${MEDIA_PATH}:/media
      - ${DOWNLOADS_PATH}:/downloads
    labels:
      - "caddy=lidarr.${LOCAL_DOMAIN}"
      - "caddy.reverse_proxy={{upstreams ${PORT_LIDARR}}}"
