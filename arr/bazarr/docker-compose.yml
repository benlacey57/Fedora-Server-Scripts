version: "3.8"

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    networks:
      - app-net
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${STORAGE_PATH}/appdata/bazarr:/config
      - ${MEDIA_PATH}:/media
    labels:
      - "caddy=bazarr.${LOCAL_DOMAIN}"
      - "caddy.reverse_proxy={{upstreams ${PORT_BAZARR}}}"
